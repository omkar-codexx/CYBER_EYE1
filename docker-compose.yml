services:
  nginx:
    image: nginx:alpine
    container_name: proton-nginx
    restart: unless-stopped
    ports:
      # Web Dashboard: Set WEB_BIND=127.0.0.1 in .env to bind admin exclusively to localhost
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8800}:8800"
      # famX Hardware Gateway: Publicly accessible for remote field devices
      - "${DEVICE_BIND:-0.0.0.0}:${DEVICE_PORT:-5000}:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cybereye-app
    networks:
      - proton-net

  cybereye-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybereye-app
    restart: unless-stopped
    expose:
      - "8800"
      - "5000"
    environment:
      PYTHONUNBUFFERED: "1"
      WEB_PORT: "8800"
      DEVICE_PORT: "5000"
      HOST: "0.0.0.0"
      SECRET_KEY: "${SECRET_KEY:-cybereye-secret}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      IP_PORT_CHECK_INTERVAL: "${IP_PORT_CHECK_INTERVAL:-30}"
    volumes:
      # Persistent databases
      - ./database.json:/app/database.json
      - ./users_db.json:/app/users_db.json
      # Device logs, calls, sms, contacts
      - ./data:/app/data
      # Uploaded media, recordings, photos
      - ./media:/app/media
    networks:
      - proton-net

networks:
  proton-net:
    driver: bridge
