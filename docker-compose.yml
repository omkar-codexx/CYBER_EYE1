services:
  cybereye-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybereye-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "5000"
      HOST: "0.0.0.0"
      SECRET_KEY: "${SECRET_KEY:-cybereye-secret}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-AIzaSyBsHMZ1SrAaMXdXScPGbycCZokkD5B3tP0}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      IP_PORT_CHECK_INTERVAL: "${IP_PORT_CHECK_INTERVAL:-30}"
    volumes:
      # Persistent databases
      - ./database.json:/app/database.json
      - ./users_db.json:/app/users_db.json
      # Device logs, calls, sms, contacts
      - ./data:/app/data
      # Uploaded media, recordings, photos
      - ./media:/app/media
