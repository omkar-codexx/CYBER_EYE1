user  nginx;
worker_processes  auto;
worker_rlimit_nofile 20480;


error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression for fast dashboard loading
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream to Backend App (Localhost inside Gluetun network namespace)
    upstream famx_device_upstream {
        ip_hash; # Sticky routing for hardware device sockets
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream web_dashboard_upstream {
        server 127.0.0.1:8801 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }


    # -------------------------------------------------------------
    # 1. Port 5000: famX Device Ingestion Gateway (Hardware Telemetry)
    # -------------------------------------------------------------
    server {
        listen 5000;
        server_name _;

        client_max_body_size 100M;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # WebSocket connection for camera, GPS, logs
        location /socket.io/ {
            proxy_pass http://famx_device_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Device media uploads & telemetry REST API
        location / {
            proxy_pass http://famx_device_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------
    # 2. Port 8800: Web Dashboard & Admin Portal
    # -------------------------------------------------------------
    server {
        listen 8800;
        server_name _;

        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket relay for browser dashboard
        location /socket.io/ {
            proxy_pass http://web_dashboard_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Web Dashboard HTML views, login, admin portal
        location / {
            proxy_pass http://web_dashboard_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
