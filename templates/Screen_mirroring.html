<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBEREYE — Remote Mirroring Node</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --brand: #2ECC8F;
            --bg: #050507;
            --card: #0d0d0f;
            --border: #1f1f23;
            --accent: #22d3ee;
            --danger: #ef4444;
            --btn-bg: #161618;
            --silver: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 50px;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            height: 98vh;
            align-items: center;
        }

        /* ── SIDEBAR ── */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
        }
        .logo .white { background: linear-gradient(#fff, #9ca3af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo .cyan { background: linear-gradient(#22d3ee, #0891b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-left: 4px; }

        .section-label {
            font-size: 9px;
            color: #52525b;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
            display: block;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 12px;
            text-transform: uppercase;
            position: relative;
        }

        .btn-start { background: var(--btn-bg); color: #fff; }
        .btn-start:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }

        .btn-stop { background: var(--btn-bg); color: #fff; }
        .btn-stop:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:disabled::after {
            content: "Stop first then use";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: var(--danger);
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            border: 1px solid var(--danger);
        }
        .btn:disabled:hover::after { opacity: 1; transform: translateX(-50%) translateY(-5px); }

        .pill-group { display: flex; gap: 6px; }
        .time-pill {
            flex: 1;
            background: var(--btn-bg);
            border: 1px solid var(--border);
            color: #71717a;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 10px;
        }
        .time-pill.active { border-color: var(--brand); color: #fff; }
        .time-pill:disabled { opacity: 0.5; cursor: not-allowed; }

        .custom-select {
            width: 100%;
            background: var(--btn-bg);
            border: 1px solid var(--border);
            color: #eee;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }
        .custom-select:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── PHONE STAGE ── */
        .mirror-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100%;
            width: 100%;
        }

        .lock-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-right: 30px;
        }

        .lock-btn {
            width: 54px;
            height: 54px;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            color: #52525b;
        }
        .lock-btn:hover { border-color: var(--brand); color: var(--brand); transform: translateX(-5px); }
        .lock-btn i { font-size: 18px; }
        .lock-btn .tooltip {
            position: absolute;
            right: 100%;
            margin-right: 15px;
            background: #000;
            color: var(--brand);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            border: 1px solid var(--brand);
        }
        .lock-btn:hover .tooltip { opacity: 1; }

        .phone-frame {
            width: 380px;
            height: 800px;
            background: #000;
            border-radius: 54px;
            padding: 10px;
            position: relative;
            margin-top: -25px; /* Shift the phone frame slightly upwards */
            box-shadow:
                0 0 0 2px #222,
                0 0 0 8px #0a0a0c,
                0 40px 100px rgba(0,0,0,0.9);
        }

        /* SILVER Hardware Buttons */
        .frame-btn {
            position: absolute;
            background: #c0c0c0; /* Silver color */
            border-radius: 2px;
            width: 4px;
            z-index: 10;
            box-shadow: 0 0 5px rgba(255,255,255,0.2);
        }
        .btn-vol-up { top: 120px; right: -11px; height: 50px; }
        .btn-vol-down { top: 185px; right: -11px; height: 50px; }
        .btn-power { top: 150px; left: -11px; height: 60px; }

        .phone-frame::before {
            content: '';
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 6px;
            background: #151518;
            border-radius: 10px;
            z-index: 20;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 44px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #111;
            position: relative;
        }

        .mirror-content {
            flex: 1;
            width: 100%;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .mirror-img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Fit full frame without bars or crops */
            display: block;
        }

        .android-nav {
            height: 42px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 2px;
            border-top: 1px solid #0d0d0f;
            z-index: 30;
        }

        .nav-key {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3f3f46;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 50%;
        }
        .nav-key:hover { color: #fff; background: rgba(255,255,255,0.03); }
        .nav-key i { font-size: 15px; }

        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050507;
            z-index: 5;
            color: #222;
        }

        .status-footer {
            font-size: 10px;
            color: #3f3f46;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        /* SMART TOAST POPUP */
        #smart-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #111;
            border-left: 4px solid var(--brand);
            padding: 15px 25px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateX(200%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
        }
        #smart-toast.show { transform: translateX(0); }
        #smart-toast i { color: var(--brand); font-size: 18px; }
        #smart-toast span { font-size: 13px; font-weight: 600; color: #eee; }

        .live-dot { width: 5px; height: 5px; background: var(--danger); border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="smart-toast">
        <i class="fas fa-circle-check"></i>
        <span id="toast-msg">Command Execution Success</span>
    </div>

    <div class="layout">
        <div class="controls-panel">
            <div class="logo"><span class="white">CYBER</span><span class="cyan">EYE</span></div>

            <div style="display:flex; flex-direction:column; gap:15px; margin-top:10px;">
                <div>
                    <span class="section-label">Session Limit</span>
                    <div class="pill-group">
                        <button class="time-pill" data-sec="15">15S</button>
                        <button class="time-pill" data-sec="30">30S</button>
                        <button class="time-pill active" data-sec="60">1M</button>
                    </div>
                </div>

                <div>
                    <span class="section-label">FPS Control (Delay)</span>
                    <select class="custom-select" id="fps-val">
                        <option value="300">300ms (Hyper-Fast)</option>
                        <option value="500" selected>500ms (Default)</option>
                        <option value="800">800ms (Standard)</option>
                        <option value="1000">1s (Economy)</option>
                        <option value="10000">10s (Minimal)</option>
                        <option value="30000">30s (Static)</option>
                    </select>
                </div>

                <div>
                    <span class="section-label">Stream Quality</span>
                    <select class="custom-select" id="quality-val">
                        <option value="10">10% - FASTEST</option>
                        <option value="20" selected>20% - MINIMAL</option>
                        <option value="40">40% - BALANCED</option>
                        <option value="60">60% - HIGH</option>
                        <option value="80">80% - ULTRA</option>
                        <option value="100">100% - LOSSLESS</option>
                    </select>
                </div>

                <button class="btn btn-start" id="start-btn"><i class="fas fa-play"></i> START LIVE SCREEN</button>
                <button class="btn btn-stop" id="stop-btn" disabled><i class="fas fa-stop"></i> STOP SCREEN</button>
            </div>

            <div class="status-footer">
                <i class="fas fa-microchip"></i> Node standby
            </div>
        </div>

        <div class="mirror-stage">
            <div class="lock-controls">
                <div class="lock-btn" onclick="sendAction('LOCK_SCREEN')">
                    <span class="tooltip">SOFT LOCK</span>
                    <i class="fas fa-lock"></i>
                </div>
                <div class="lock-btn" onclick="sendAction('FORCE_LOCK')">
                    <span class="tooltip">ADMIN LOCK</span>
                    <i class="fas fa-user-shield"></i>
                </div>
            </div>

            <div class="phone-frame">
                <!-- SILVER Hardware Buttons -->
                <div class="frame-btn btn-vol-up"></div>
                <div class="frame-btn btn-vol-down"></div>
                <div class="frame-btn btn-power"></div>

                <div class="phone-screen">
                    <div class="mirror-content">
                        <div class="placeholder" id="placeholder">
                            <i class="fas fa-video-slash" style="font-size:20px; opacity:0.2"></i>
                        </div>
                        <img id="mirror-img" class="mirror-img" src="" alt="Mirror Feed">
                    </div>

                    <div class="android-nav">
                        <div class="nav-key" onclick="sendNav('BACK')"><i class="fas fa-chevron-left"></i></div>
                        <div class="nav-key" onclick="sendNav('HOME')"><i class="far fa-circle"></i></div>
                        <div class="nav-key" onclick="sendNav('RECENT')"><i class="fas fa-square-full" style="font-size:12px; opacity:0.6"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deviceID = urlParams.get('id');
        let isMirroring = false, lastTime = 0, sessionTimer = null;

        // Initialize Real-Time Socket.IO
        const socket = io();

        socket.on('connect', () => {
            if (deviceID) {
                socket.emit('join_device_room', { device_id: deviceID });
            }
        });

        // 1. Binary real-time socket frame relay (ArrayBuffer / Blob)
        socket.on('mirror_frame_relay', (data) => {
            if (!isMirroring) return;
            const frameBuffer = data.frame || data;
            const battery = data.battery || '--';
            let blob;
            if (frameBuffer instanceof ArrayBuffer) {
                blob = new Blob([frameBuffer], { type: 'image/jpeg' });
            } else if (typeof frameBuffer === 'string' && frameBuffer.startsWith('data:')) {
                document.getElementById('mirror-img').src = frameBuffer;
                document.getElementById('placeholder').style.display = 'none';
                return;
            }
            if (blob) {
                const imgEl = document.getElementById('mirror-img');
                const oldUrl = imgEl.src;
                imgEl.src = URL.createObjectURL(blob);
                if (oldUrl && oldUrl.startsWith('blob:')) {
                    URL.revokeObjectURL(oldUrl);
                }
                document.getElementById('placeholder').style.display = 'none';
                document.querySelector('.status-footer').innerHTML = `
                    <div class="live-dot" style="background: var(--brand); box-shadow: 0 0 10px var(--brand);"></div> 
                    FEED ACTIVE &bull; Real-Time Socket Stream &bull; Bat: ${battery}%
                `;
                document.getElementById('stop-btn').disabled = false;
            }
        });

        // 2. HTTP uploaded mirror frame push (Zero Polling Latency)
        socket.on('mirror_update', (data) => {
            if (!isMirroring) return;
            if (data.device_id && data.device_id !== deviceID) return;
            if (data.url) {
                const imgEl = document.getElementById('mirror-img');
                imgEl.src = data.url;
                document.getElementById('placeholder').style.display = 'none';
                document.querySelector('.status-footer').innerHTML = `
                    <div class="live-dot" style="background: var(--brand); box-shadow: 0 0 10px var(--brand);"></div> 
                    FEED ACTIVE &bull; Push Stream Active
                `;
                document.getElementById('stop-btn').disabled = false;
            }
        });

        function showPopup(msg, isError = false) {
            const toast = document.getElementById('smart-toast');
            const msgEl = document.getElementById('toast-msg');
            const icon = toast.querySelector('i');

            msgEl.textContent = msg;
            toast.style.borderColor = isError ? 'var(--danger)' : 'var(--brand)';
            icon.className = isError ? 'fas fa-circle-exclamation' : 'fas fa-circle-check';
            icon.style.color = isError ? 'var(--danger)' : 'var(--brand)';

            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function sendNav(cmd) {
            if(!deviceID) return;
            const btn = event.currentTarget;
            btn.style.color = '#2ECC8F';
            setTimeout(() => btn.style.color = '', 300);
            await fetch(`/api/device/${deviceID}/action`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:`NAV_${cmd}`})
            });
        }

        async function sendAction(act) {
            if(!deviceID) return;
            await fetch(`/api/device/${deviceID}/action`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:act})
            });
            showPopup("Command Sent: " + act);
        }

        function updateStatus() {
            if(!deviceID || !isMirroring) return;
            fetch(`/api/device/${deviceID}/mirror_status`)
                .then(r => r.json())
                .then(data => {
                    if (data.url && data.time > lastTime) {
                        const frameTime = data.time;
                        const imgPreload = new Image();
                        imgPreload.src = data.url + "?t=" + frameTime;
                        imgPreload.onload = () => {
                            if (frameTime > lastTime) {
                                lastTime = frameTime;
                                document.getElementById('mirror-img').src = imgPreload.src;
                                document.getElementById('placeholder').style.display = 'none';
                                
                                const latency = ((Date.now() - frameTime) / 1000).toFixed(1);
                                const latencyText = latency > 5 ? `Lag: ${latency}s (Slow)` : `Latency: ${latency}s`;
                                const statusColor = latency > 5 ? 'var(--danger)' : 'var(--brand)';

                                document.querySelector('.status-footer').innerHTML = `
                                    <div class="live-dot" style="background: ${statusColor}"></div> 
                                    FEED ACTIVE &bull; ${latencyText} &bull; Bat: ${data.bat || '--'}%
                                `;
                                document.getElementById('stop-btn').disabled = false;
                            }
                        };
                    }
                })
                .catch(e => console.error(e));
        }
        // Fallback polling every 1.5s
        setInterval(updateStatus, 1500);

        function toggleControls(disable) {
            document.getElementById('start-btn').disabled = disable;
            document.getElementById('quality-val').disabled = disable;
            document.getElementById('fps-val').disabled = disable;
            document.querySelectorAll('.time-pill').forEach(p => p.disabled = disable);
        }

        document.getElementById('start-btn').onclick = async () => {
            if(!deviceID) return alert("Device ID required");
            const sec = document.querySelector('.time-pill.active').dataset.sec;
            const q = document.getElementById('quality-val').value;
            const fps = document.getElementById('fps-val').value;

            isMirroring = true;
            toggleControls(true);
            document.getElementById('stop-btn').disabled = false;

            await fetch(`/api/device/${deviceID}/action`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:`START_MIRROR:${sec}:${q}:${fps}`})
            });

            // Set session timer
            if(sessionTimer) clearTimeout(sessionTimer);
            sessionTimer = setTimeout(() => {
                showPopup("Session limit reached. Click STOP to reset.", true);
            }, sec * 1000);
        };

        document.getElementById('stop-btn').onclick = async () => {
            if(sessionTimer) clearTimeout(sessionTimer);
            isMirroring = false;
            toggleControls(false);
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('placeholder').style.display = 'flex';
            await fetch(`/api/device/${deviceID}/action`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({action:'STOP_MIRROR'})
            });
            showPopup("Mirror Pipeline Terminated");
        };

        document.querySelectorAll('.time-pill').forEach(p => p.onclick = () => {
            document.querySelectorAll('.time-pill').forEach(x => x.classList.remove('active'));
            p.classList.add('active');
        });
    </script>
</body>
</html>
