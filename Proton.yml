services:
  # ProtonVPN Client with Port Forwarding via Gluetun
  proton-vpn:
    image: qmcgaw/gluetun:latest
    container_name: proton-vpn
    hostname: proton-vpn
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    # Expose web dashboard to your host machine (http://localhost:5000)
    # Note: Because monitoring-server uses network_mode: "service:proton-vpn",
    # all exposed ports must be defined here on the proton-vpn service.
    ports:
      - "${PORT:-5000}:5000"

    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn

      # ProtonVPN credentials from .env
      OPENVPN_USER: ${PROTON_OPENVPN_USER}
      OPENVPN_PASSWORD: ${PROTON_OPENVPN_PASSWORD}

      OPENVPN_PROTOCOL: udp
      PORT_FORWARD_ONLY: "on"
      # Country filter (e.g. India, Netherlands, Switzerland, Singapore)
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-India}

      # City filter (e.g. Mumbai)
      SERVER_CITIES: ${SERVER_CITIES:-Mumbai}

      # Specific server name(s) (e.g. IN#22 or IN#22,IN#41,IN#37)
      SERVER_NAMES: ${SERVER_NAMES:-}

      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PORTS_COUNT: "1"

      # Route Proton public forwarded port to internal container port 5000
      VPN_PORT_FORWARDING_LISTENING_PORTS: "5000"

      # Writes the assigned public port to ./gluetun/forwarded_port
      VPN_PORT_FORWARDING_STATUS_FILE: "/gluetun/forwarded_port"

      TZ: Asia/Kolkata

    volumes:
      - ./gluetun:/gluetun

  monitoring-server:
    build:
      context: ${APP_DIR:-./}
      dockerfile: Dockerfile

    container_name: proton-monitoring-server
    restart: unless-stopped

    # Routes all traffic through ProtonVPN
    network_mode: "service:proton-vpn"

    depends_on:
      proton-vpn:
        condition: service_healthy

    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "5000"
      HOST: "0.0.0.0"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      IP_PORT_CHECK_INTERVAL: ${IP_PORT_CHECK_INTERVAL:-30}
      FORWARDED_PORT_FILE: "/gluetun/forwarded_port"

    volumes:
      # Logs, SMS, Calls, Contacts, Notifications
      - ./website/data:/app/datawebsite
      # Photos, Audio recordings, Screenshots, Live Camera, Screen  (Flask saves to /app/media)
      - ./website/uploads:/app/media
      # Device state registry database
      - ${APP_DIR:-./}/database.json:/app/database.json
      # Gluetun port status file mount
      - ./gluetun:/gluetun:ro
      # Optional: Live source code mount for edits without rebuild
      - ${APP_DIR:-./}:/app
      # Isolate container from host venv
      - /app/venv
